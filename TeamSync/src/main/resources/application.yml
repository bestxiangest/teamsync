server:
  port: 8080

spring:
  application:
    name: TeamSync
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: >-
      ${DB_URL:jdbc:postgresql://192.168.8.6:5433/postgres?currentSchema=teamsync}
    username: ${DB_USERNAME:toplink}
    password: ${DB_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-qingdao.aliyuncs.com}
    bucket-name: ${OSS_BUCKET_NAME:teamsync-files}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}

teamsync:
  mail:
    reminder:
      enabled: ${TEAMSYNC_MAIL_REMINDER_ENABLED:true}
      overdue-cron: ${TEAMSYNC_MAIL_REMINDER_CRON:0 0 * * * *}
      from-address: ${TEAMSYNC_MAIL_FROM:${MAIL_USERNAME:}}
      from-name: ${TEAMSYNC_MAIL_FROM_NAME:TeamSync}
      frontend-base-url: ${TEAMSYNC_FRONTEND_BASE_URL:http://127.0.0.1:8081}
